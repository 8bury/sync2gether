name: Pacotes e Release

# Só roda manualmente: Actions → Pacotes e Release → Run workflow.
# Para uma release, atualize antes `version` no Cargo.toml e `pkgver` no
# packaging/arch/PKGBUILD. "nenhuma" só gera os pacotes como artefatos.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release no GitHub
        type: choice
        options:
          - rascunho
          - publicada
          - nenhuma
        default: rascunho

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      pkgver: ${{ steps.version.outputs.pkgver }}
    steps:
      - uses: actions/checkout@v7
      - name: Conferir versão antes de compilar
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.release }}
        run: |
          if [ "$MODE" != nenhuma ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases só podem ser criadas a partir de main (ref atual: $GITHUB_REF)."
            exit 1
          fi
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          expected_pkgver="${version//-/}"
          if [ "$expected_pkgver" != "$pkgver" ]; then
            echo "::error::Cargo.toml ($version -> $expected_pkgver) e PKGBUILD ($pkgver) têm versões diferentes."
            exit 1
          fi
          if [ "$MODE" != nenhuma ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::A tag v$version já existe. Atualize Cargo.toml e PKGBUILD."
              exit 1
            fi
            status=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --include 2>&1 | head -1 || true)
            if [[ "$status" == *" 200 "* ]]; then
              echo "::error::A release v$version já existe. Atualize Cargo.toml e PKGBUILD."
              exit 1
            elif [[ "$status" != *" 404 "* ]]; then
              echo "::error::Não foi possível verificar releases existentes: $status"
              exit 1
            fi
            drafts=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq "[.[] | select(.tag_name == \"v$version\")] | length")
            if [ "$drafts" -gt 0 ]; then
              echo "::error::Já existe um rascunho de release para v$version."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: ubuntu:24.04
          - format: arch
            image: archlinux:base-devel
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      SKIP_CHECKS: 1
    steps:
      - name: Dependências do checkout
        run: |
          if [ '${{ matrix.format }}' = arch ]; then
            pacman -Syu --noconfirm git zstd
          else
            apt-get update
            apt-get install -y --no-install-recommends -o Acquire::Retries=5 git ca-certificates zstd
          fi
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            target/release-${{ matrix.format }}/release/deps
            target/release-${{ matrix.format }}/release/build
            target/release-${{ matrix.format }}/release/.fingerprint
            target/cargo-${{ matrix.format }}/bin
            target/cargo-${{ matrix.format }}/registry/index
            target/cargo-${{ matrix.format }}/registry/cache
            target/cargo-${{ matrix.format }}/git/db
            target/rustup-${{ matrix.format }}
          key: linux-release-v2-${{ matrix.format }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/release-container.sh') }}
          restore-keys: |
            linux-release-v2-${{ matrix.format }}-
      - name: Compilar, empacotar e testar o pacote instalado
        run: bash scripts/release-container.sh '${{ matrix.format }}'
      - uses: actions/upload-artifact@v7
        with:
          name: sync2gether-${{ matrix.format }}
          path: |
            target/dist/*.deb
            target/dist/*.pkg.tar.zst
          if-no-files-found: error

  package-windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configurar linker rápido (lld-link)
        shell: pwsh
        run: |
          if (Get-Command lld-link -ErrorAction SilentlyContinue) {
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Resolver libmpv-2.dll (x86_64)
        id: mpv_meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release) {
            throw "Falha ao consultar shinchiro/mpv-winbuild-cmake"
          }
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-(?!v3-).*\.7z$' } | Select-Object -First 1
          if (-not $asset) {
            throw "Asset mpv-dev-x86_64 não encontrado na release $($release.tag_name)"
          }
          "tag=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "url=$($asset.browser_download_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/cache@v6
        id: mpv_cache
        with:
          path: .cache/libmpv
          key: libmpv-win-x86_64-${{ steps.mpv_meta.outputs.tag }}
      - name: Baixar e extrair libmpv-2.dll
        if: steps.mpv_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .cache/libmpv | Out-Null
          $archive = ".cache/libmpv/mpv-dev.7z"
          curl.exe -fsSL --retry 5 --retry-all-errors --max-time 180 -o $archive "${{ steps.mpv_meta.outputs.url }}"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao baixar $archive" }
          7z e -y "-o.cache/libmpv" $archive "libmpv-2.dll"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao extrair libmpv-2.dll" }
          Remove-Item -Force $archive
          if (-not (Test-Path ".cache/libmpv/libmpv-2.dll")) {
            throw "libmpv-2.dll não encontrada após extração"
          }
      - uses: actions/cache@v6
        id: nsis_cache
        with:
          path: .cache/nsis
          key: nsis-3.13-ba63dffc
      - name: Baixar NSIS portátil 3.13
        if: steps.nsis_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .cache/nsis | Out-Null
          $zip = ".cache/nsis/nsis-3.13.zip"
          curl.exe -fsSL --retry 5 --retry-all-errors --max-time 120 -o $zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao baixar NSIS 3.13" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8") {
            throw "Checksum SHA-256 inesperado do NSIS 3.13: $hash"
          }
          Expand-Archive -Path $zip -DestinationPath .cache/nsis -Force
          Remove-Item -Force $zip
      - name: Adicionar NSIS ao PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.cache\nsis\nsis-3.13"
      - name: Compilar release
        run: cargo build --release --locked
      - name: Empacotar zip e instalador NSIS
        shell: pwsh
        run: pwsh -File scripts/package-windows.ps1 -LibMpvPath .cache\libmpv\libmpv-2.dll
      - uses: actions/upload-artifact@v7
        with:
          name: sync2gether-windows
          path: |
            target/dist/*-windows-x86_64.zip
            target/dist/*-windows-x86_64-setup.exe
          if-no-files-found: error

  package-macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            lto: thin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            lto: "false"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Instalar libmpv via Homebrew
        run: |
          for attempt in 1 2 3; do
            if brew install mpv; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Compilar release
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Empacotar .app e .dmg
        run: bash scripts/package-macos.sh "${{ matrix.arch }}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: sync2gether-macos-${{ matrix.arch }}
          path: target/dist/*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    needs: [version, package, package-windows, package-macos]
    if: inputs.release != 'nenhuma'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      PKGVER: ${{ needs.version.outputs.pkgver }}
      MODE: ${{ inputs.release }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Criar release
        run: |
          cd dist
          deb="sync2gether_${VERSION}_amd64.deb"
          pkg=$(ls sync2gether-"$PKGVER"-*-x86_64.pkg.tar.zst)
          win_zip="sync2gether-${VERSION}-windows-x86_64.zip"
          win_setup="sync2gether-${VERSION}-windows-x86_64-setup.exe"
          mac_arm64="sync2gether-${VERSION}-macos-arm64.dmg"
          mac_x86_64="sync2gether-${VERSION}-macos-x86_64.dmg"
          for f in "$pkg" "$deb" "$win_zip" "$win_setup" "$mac_arm64" "$mac_x86_64"; do
            test -f "$f"
          done
          sha256sum "$pkg" "$deb" "$win_zip" "$win_setup" "$mac_arm64" "$mac_x86_64" > SHA256SUMS
          cat > notes.md <<EOF
          ## Downloads e instalação

          Os binários de release não incluem o modo demo.

          ### Windows (x86_64)

          - **Instalador:** execute \`$win_setup\` (instala na pasta do usuário, sem precisar de administrador, já com \`libmpv-2.dll\`).
          - **Portátil:** extraia \`$win_zip\` e execute \`sync2gether.exe\` (mantenha \`libmpv-2.dll\` na mesma pasta).

          > O executável ainda não possui certificado de assinatura do Windows. Se o **Windows SmartScreen** exibir um aviso, clique em **Mais informações → Executar assim mesmo**.

          ### macOS (Apple Silicon e Intel)

          - **Apple Silicon (M1/M2/M3/M4):** baixe \`$mac_arm64\`.
          - **Intel (x86_64):** baixe \`$mac_x86_64\`.

          Abra o \`.dmg\` e arraste **sync2gether.app** para **Applications** (\`libmpv\` e dependências já estão incluídas). Requer macOS 15 ou mais recente.

          > O app ainda não possui assinatura/notarização da Apple. Se o **Gatekeeper** bloquear na primeira abertura, execute no Terminal:
          >
          > \`\`\`sh
          > xattr -cr /Applications/sync2gether.app
          > \`\`\`

          ### Arch Linux (x86_64)

          \`\`\`sh
          sudo pacman -U ./$pkg
          \`\`\`

          ### Ubuntu 24.04 (x86_64)

          \`\`\`sh
          sudo apt install ./$deb
          \`\`\`

          No Linux, os gerenciadores instalam as dependências, incluindo libmpv. O seletor de arquivos precisa do portal do desktop (\`xdg-desktop-portal-gtk\` ou \`xdg-desktop-portal-kde\`).

          ### Verificação de integridade

          \`\`\`sh
          sha256sum --ignore-missing -c SHA256SUMS
          \`\`\`

          Pacotes compilados pelo GitHub Actions (Arch Linux, Ubuntu 24.04, Windows x86_64 e macOS Apple Silicon/Intel).

          ## Mudanças
          EOF
          flags=()
          if [ "$MODE" = rascunho ]; then flags+=(--draft); fi
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" \
            "$pkg" "$deb" "$win_zip" "$win_setup" "$mac_arm64" "$mac_x86_64" SHA256SUMS \
            -R "$GITHUB_REPOSITORY" "${flags[@]}" --target "$GITHUB_SHA" \
            --title "sync2gether $VERSION" --notes-file notes.md --generate-notes
          echo "Release v$VERSION criada ($MODE)." >> "$GITHUB_STEP_SUMMARY"
