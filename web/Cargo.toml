[package]
name = "sync2gether-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Convidado do sync2gether no navegador: núcleo em WebAssembly"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = "0.3.4"
matroska-demuxer = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shiguredo_mp4 = "2026.5.0"
sync2gether-core = { path = "../core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
js-sys = "0.3.106"
wasm-bindgen = "=0.2.129"
