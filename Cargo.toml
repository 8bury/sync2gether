[package]
name = "sync2gether"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
description = "Assista a filmes locais em sincronia com outra pessoa pela internet ou rede local"
publish = false

[workspace]
members = ["core", "relay", "web"]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.5", features = ["derive", "env"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
if-addrs = "0.15"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
libloading = "0.9.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10.3"
rcgen = "0.14.10"
rfd = "0.17.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
sync2gether-core = { path = "core" }
sys-locale = "0.3.2"
sync2gether-relay = { path = "relay" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"

[features]
default = []
demo = ["dep:image"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
sync2gether-web = { path = "web" }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
