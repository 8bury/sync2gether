[package]
name = "sync2gether-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Núcleo compartilhado do sync2gether: mensagens, sincronização e criptografia sem I/O"
publish = false

[lints]
workspace = true

[features]
default = ["crypto"]
crypto = ["dep:blake3", "dep:snow", "dep:spake2"]

[dependencies]
blake3 = { version = "1.8.7", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snow = { version = "0.10.0", optional = true, default-features = false, features = ["default-resolver", "use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
spake2 = { version = "0.4.0", optional = true }
